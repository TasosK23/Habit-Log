<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Habit Log</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--card:#090d15;--card2:#0e1522;--line:#172033;--tx:#f3f6ff;--mut:#8591a8;--ac:#4da3ff;--acd:rgba(77,163,255,.15);--on:#031325}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--tx);font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,a,.hc,.gc{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .16s ease,background-color .25s ease,color .25s ease,opacity .25s ease,box-shadow .25s ease}
button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{display:block}
#app{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px calc(112px + env(safe-area-inset-bottom))}
.view{animation:vin .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* headers */
.hd{display:flex;align-items:center;gap:10px;margin:8px 0 20px}
.hd h1{flex:1;min-width:0;min-height:44px;margin:0;font-size:clamp(21px,6.4vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.15;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.hd h1 svg{width:20px;height:20px;color:var(--mut);flex:none;margin-top:3px}
.ttx{display:inline-block;overflow:hidden;text-overflow:ellipsis;animation:ttin .32s cubic-bezier(.22,1,.36,1) both}
@keyframes ttin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hd h1 b{color:var(--mut);font-weight:600}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
.ib.flat{background:none}
.top{display:flex;align-items:center;gap:8px;margin:8px 0 20px;min-height:44px}
.top h1{flex:1;margin:0;font-size:23px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h1.tt{font-size:26px;font-weight:600}
.top.stk{position:sticky;top:0;z-index:6;margin:0 -14px 14px;padding:max(8px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#000 78%,rgba(0,0,0,0))}
.save{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600;padding:8px 4px;color:var(--ac)}
.save svg{width:22px;height:22px}

/* week strip */
.wkh{position:relative;overflow:clip;touch-action:pan-y}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.wdl{height:20px;line-height:20px}
.wd{position:relative;z-index:1;min-width:0;color:var(--mut);font-size:14px;padding:2px 0;transition:color .3s ease}
.wd:active{transform:scale(.92)}
.wd.sel{color:var(--tx);font-weight:700}
.wd.tdy{color:var(--ac);font-weight:700}
.dc{position:relative;width:100%;max-width:48px;aspect-ratio:1;margin:7px auto 0;display:grid;place-items:center}
.dc svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dc .tr{stroke:#161e2d}
.dc .pg{stroke:var(--ac);transition:stroke-dasharray .55s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.dc .pg.z{opacity:0}
.nb{position:relative;width:75%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:500;color:#cfd6e6;transition:background-color .3s ease,color .3s ease,box-shadow .3s ease,transform .35s cubic-bezier(.3,1.4,.5,1)}
.wd.sel .nb{color:#fff;font-weight:700}
.wd.tdy .nb{background:var(--ac);color:var(--on);font-weight:700}
.si{position:absolute;left:0;top:0;z-index:0;width:calc((100% - 12px) / 7);padding:2px 0;pointer-events:none;transform:translateX(calc(var(--i) * (100% + 2px)));transition:transform .46s cubic-bezier(.22,1,.36,1)}
.si .dc i{display:block;width:75%;aspect-ratio:1;border-radius:50%;background:#1a263b;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);transition:background-color .35s ease,box-shadow .35s ease,transform .4s cubic-bezier(.22,1,.36,1)}
.si.at-t .dc i{background:var(--ac);box-shadow:0 0 0 4px rgba(77,163,255,.24);transform:scale(1.05)}
.gh{position:absolute;left:0;right:0;top:0;overflow:hidden;pointer-events:none}
.lw{position:relative;overflow:clip}
.dpk{position:fixed;left:50%;top:30%;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.tdot{width:5px;height:5px;border-radius:50%;margin:5px auto 0;background:transparent;transition:background-color .3s ease}
.wd.tdy .tdot{background:var(--ac)}
.wd.fut .dc{opacity:.4}
.tdbtn{display:flex;align-items:center;gap:7px;height:44px;max-width:130px;overflow:hidden;white-space:nowrap;padding:0 15px 0 12px;border-radius:22px;background:var(--ac);color:var(--on);font-weight:600;font-size:16px;flex:none;overflow:hidden;white-space:nowrap;
  transition:max-width .42s cubic-bezier(.22,1,.36,1),padding .42s cubic-bezier(.22,1,.36,1),margin .42s cubic-bezier(.22,1,.36,1),opacity .3s ease,transform .16s ease}
.tdbtn svg{width:19px;height:19px;flex:none}
.tdbtn.off{max-width:0;padding:0;margin-left:-10px;opacity:0;pointer-events:none}
@media (max-width:380px){.tdbtn{max-width:44px;padding:0 12px}.tdbtn span{display:none}}

/* filter row */
.fr{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 12px;gap:10px}
.fr label{display:block;color:var(--mut);font-size:14px;margin:0 0 7px 2px}
.pl{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.pl button{padding:10px 15px;min-height:42px;font-size:16px;color:#9aa5bb;border-radius:13px}
.pl button.on{background:var(--ac);color:var(--on);font-weight:600}
.sc{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:15px;background:var(--card);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sc svg{width:22px;height:22px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.ch{padding:9px 14px;min-height:40px;border-radius:12px;background:#0f1726;color:var(--mut);white-space:nowrap;font-size:14.5px}
.ch.on{background:var(--ac);color:var(--on);font-weight:600}
.tb{margin:2px 2px 14px;color:var(--mut);font-size:14px}
.tb b{color:var(--tx);font-weight:600}
.tbt{display:block;min-height:19px}
.bar.off{opacity:0}
.lbw{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),opacity .3s ease}
.lbw.open{grid-template-rows:1fr;opacity:1}
.lbi{min-height:0;overflow:hidden}
.sub.ok{color:var(--ac)}
.sub.miss{color:#d98a84}
.tb.all b{color:var(--ac)}
.bar{height:6px;border-radius:3px;background:#101828;margin-top:8px;overflow:hidden;transition:opacity .3s ease}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.lockbar{display:flex;align-items:center;gap:10px;background:#0b1424;border:1px solid #162540;color:#b9c6dc;border-radius:16px;padding:9px 9px 9px 14px;margin:0 0 14px;font-size:14.5px;line-height:1.35}
.lockbar svg{width:18px;height:18px;color:var(--ac);flex:none}
.lockbar span{flex:1}
.lockbar button{background:var(--ac);color:var(--on);border-radius:11px;padding:8px 13px;font-weight:600;font-size:14px;flex:none}
.lockbar.warn{background:#241012;border-color:#47201f;color:#ffc9c2}
.lockbar.warn svg{color:#ff8a80}

/* habit card */
.hc{--c:#4da3ff;--cd:#0a1724;background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;cursor:pointer;transition:transform .16s ease,opacity .3s ease;content-visibility:auto;contain-intrinsic-size:auto 222px}
.hc:active:not(:has(button:active)){transform:scale(.985)}
.hc.dim{opacity:.6}
.hr{display:flex;align-items:center;gap:10px}
.ico{width:46px;height:46px;border-radius:50%;background:rgba(77,163,255,.14);background:color-mix(in srgb,var(--c) 16%,#000);display:grid;place-items:center;font-size:22px;flex:none}
.mt{flex:1;min-width:0}
.ttl{font-size:18px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:14.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:46px;height:46px;border-radius:50%;background:var(--acd);display:grid;place-items:center;flex:none;font-weight:600;font-size:14px;color:var(--tx)}
.rb svg{width:22px;height:22px}
.rb.on{background:var(--ac);color:var(--on)}
.rb.note{background:#0f1726;color:#c9d2e4}
.rb.note.has{background:var(--acd);color:var(--ac)}
.rb.lk,.cnt.lk{opacity:.42}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.17)}100%{transform:scale(1)}}
.cnt{display:flex;align-items:center;background:var(--acd);border-radius:23px;height:46px;flex:none;transition:background-color .25s ease,color .25s ease,opacity .25s ease}
.cnt button{width:36px;height:46px;font-size:22px;display:grid;place-items:center;color:var(--ac)}
.cnt span{min-width:38px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.cnt.lk{padding:0 8px}
.cnt.on{background:var(--ac);color:var(--on)}
.cnt.on button{color:var(--on)}
.heat{display:grid;grid-template-columns:repeat(22,1fr);gap:3px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--cd)}
.heat i.d{background:var(--c)}
.heat i.p{background:var(--c);opacity:.5}
.heat i.n{background:#070a10}
.heat i.f{visibility:hidden}
.empty{color:var(--mut);text-align:center;padding:50px 20px;font-size:16px;line-height:1.5}
.empty.sm{padding:16px 20px}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding:14px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),#000 34%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;z-index:5}
.ni{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;color:#3a465c;font-size:11.5px;font-weight:500;padding:4px 0;width:100%;max-width:64px;white-space:nowrap}
.ni svg{width:26px;height:26px}
.ni.on{color:var(--ac)}
.ni.dot::after{content:"";position:absolute;top:2px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:#ffb547;box-shadow:0 0 0 2px #000}
.add{width:56px;height:52px;border-radius:17px;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 22px rgba(77,163,255,.3)}
.add svg{width:30px;height:30px}

/* form */
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font:inherit;font-size:17px;color:var(--tx);margin-bottom:12px;outline:0;transition:border-color .2s ease}
.inp::placeholder{color:#5c6880}
.inp:focus{border-color:var(--ac)}
textarea.inp{resize:none;min-height:100px;margin:12px 0 0;line-height:1.4}
.pick{display:flex;gap:12px;margin:6px 0 18px}
.pk{flex:1;display:flex;align-items:center;gap:12px;font-size:17px}
.pk>span,.pk>i{width:48px;height:48px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:22px;font-style:normal;flex:none}
.pk>i b{display:block;width:28px;height:28px;border-radius:50%;transition:background-color .3s ease}
.blk{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px}
.blk h3{margin:0 0 14px;font-size:17px;font-weight:600}
.blk p{margin:0;color:var(--mut);font-size:15px;line-height:1.45}
.seg{display:flex;gap:8px}
.sg{flex:1;padding:13px 6px;border-radius:14px;background:#0f1522;color:var(--mut);font-size:16px;text-align:center}
.sg.on{background:#183a62;color:#fff;font-weight:600}
.hint{text-align:center;color:var(--mut);font-size:14.5px;margin:14px 0 0}
.fnote{color:var(--mut);font-size:14px;text-align:center;margin:4px 8px 0;line-height:1.4}
.rd{display:flex;align-items:center;gap:14px;padding:9px 2px;font-size:17px;width:100%;text-align:left}
.rd:active{transform:none}
.rdo{width:26px;height:26px;border-radius:50%;border:2.5px solid #dfe5f1;display:grid;place-items:center;flex:none;transition:border-color .2s ease}
.rdo::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ac);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.rd.on .rdo{border-color:var(--ac)}
.rd.on .rdo::after{transform:scale(1)}
.sb{margin:4px 0 10px 40px;animation:vin .3s ease both}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .ch{min-width:40px;text-align:center}
.step{display:flex;align-items:center;gap:12px;font-size:16px;flex-wrap:wrap}
.sp{display:inline-flex;align-items:center;background:#0f1522;border-radius:14px}
.sp button{width:40px;height:40px;font-size:20px;color:var(--ac)}
.sp span{min-width:34px;text-align:center;font-weight:600;font-size:17px}
.sline{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:600}
.sw{width:54px;height:32px;border-radius:16px;background:#1a2232;position:relative;flex:none}
.sw::before{content:"";position:absolute;inset:-7px -4px}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#e8edf7;transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(22px);background:#fff}

/* detail */
.desc{color:var(--mut);margin:-12px 4px 16px;font-size:15px;line-height:1.4}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:18px;padding:14px 16px}
.st b{display:block;font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.st span{color:var(--mut);font-size:13.5px}
.st small{color:var(--mut);font-size:13px}
.st.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.st.wide b{font-size:36px;color:var(--ac)}
.cal{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:17px;font-weight:600}
.mh button{width:38px;height:38px;border-radius:50%;background:#0f1522;display:grid;place-items:center}
.mh svg{width:18px;height:18px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cg .dn{color:var(--mut);font-size:12.5px;padding-bottom:4px}
.cg .cell,.cg .e{aspect-ratio:1;border-radius:10px;font-size:14px;display:grid;place-items:center;color:#cfd6e6;position:relative;user-select:none;-webkit-user-select:none}
.cg .cell{background:#0d1420;transition:background-color .4s ease,color .4s ease}
.cg .cell.cd{background:var(--c);color:var(--on);font-weight:700}
.cg .cell.cm{color:#76808f}
.cg .cell.ct{box-shadow:inset 0 0 0 2px var(--ac)}
.cg .cell.cf{opacity:.35}
.cg .cell.nt::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:16px;background:var(--card);font-size:15.5px;font-weight:500;min-width:30%}
.acts .dg{color:#ff8a80}
.acts .pr{background:var(--ac);color:var(--on);font-weight:600;flex-basis:100%}
.acts svg{width:19px;height:19px}

/* score */
.gcard{background:var(--card);border-radius:24px;padding:22px 14px 20px;text-align:center;margin-bottom:12px}
.gcard h2{margin:0 0 6px;font-size:19px;font-weight:600}
.gauge{width:100%;max-width:300px;margin:0 auto}
.needle{transform-origin:150px 150px;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-block;background:#0d1a2c;border-radius:20px;padding:11px 22px;font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--card);border-radius:22px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .16s ease}
.gc:active{transform:scale(.97)}
.gc .gn{font-size:15.5px;font-weight:600;margin:4px 0 8px;padding:0 4px;line-height:1.2}
.gc .pill{font-size:15px;padding:6px 14px;margin:0}
.gc .gs{color:var(--mut);font-size:12.5px;margin-top:8px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.trio.four{grid-template-columns:repeat(2,1fr)}
.trio .st{padding:12px 10px;text-align:center}
.trio .st b{font-size:20px}
.trio .st span{font-size:12.5px}

/* charts */
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600}
.card .cap{color:var(--mut);font-size:13.5px;margin:10px 0 0}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px}
.bars.sm{height:110px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bc small{font-size:11px;color:var(--mut);height:13px;white-space:nowrap}
.bt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bv{width:70%;max-width:26px;border-radius:7px;background:#121c2e;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bv.on{background:var(--ac)}
.bc span{font-size:12.5px;color:var(--mut)}
.bc.tod span{color:var(--tx);font-weight:700}

/* timeline */
.tw{position:relative}
.tw::before{content:"";position:absolute;left:19.5px;top:0;bottom:0;width:5px;border-radius:3px;background:#111a2a}
.mo{margin:4px 0 14px 54px;font-size:17px;font-weight:600;text-align:center}
.ev{display:flex;align-items:center;gap:12px;margin-bottom:12px;position:relative}
.dot{width:44px;height:44px;border-radius:50%;background:#0f1726;display:grid;place-items:center;flex:none;z-index:1;color:var(--mut)}
.ev.first .dot{background:var(--ac);color:var(--on)}
.dot svg{width:20px;height:20px}
.evc{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 16px;font-size:15.5px;font-weight:500}
.evc svg{width:20px;height:20px;color:var(--ac);flex:none}
.evc .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evc small{color:var(--mut);font-size:13.5px;font-weight:400;flex:none}

/* meditation */
.goals{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:0 0 6px}
.glabel{text-align:center;color:var(--mut);font-size:13.5px;margin:6px 0 10px}
.mring{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:12px auto 18px}
.mring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.mring .tr{stroke:#0f1726}
.mring .pg{stroke:var(--ac);transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.mring.run .pg{transition:none}

const reId=/^[A-Za-z0-9_-]{1,40}$/,reDate=/^\d{4}-\d{2}-\d{2}$/,reColor=/^#[0-9a-fA-F]{6}$/;

    if(d>t)cls='f';else if(d<h.created)cls='n';else if(isDone(h,d))cls='d';else if(frac(h,d)>0)cls='p';
    out+=cls?`<i class="${cls}"></i>`:'<i></i>';
  }
  const html=`<div class="heat">${out}</div>`;heatCache.set(h.id,{k:ck,html});return html;
}
function ctrl(h,d,locked){
  const v=logOf(h,d),dn=isDone(h,d);
  if(isMed(h)&&d>=S.settings.medFrom){
    if(locked)return `<button class="rb lk${dn?' on':''}" data-act="locked" aria-label="Locked">${dn?IC.check:IC.lotus}</button>`;
    return `<button class="rb${dn?' on':''}" data-act="tab" data-v="med" aria-label="Open the meditation timer">${dn?IC.check:IC.lotus}</button>`;
  }
  const r=rule(h,d);
  if(r.tracking==='count'){
    if(locked)return `<div class="cnt lk${dn?' on':''}" data-act="locked"><span>${v||0}/${r.target}</span></div>`;
    return `<div class="cnt${dn?' on':''}"><button data-act="dec" data-id="${h.id}" aria-label="Decrease">−</button><span>${v||0}/${r.target}</span><button data-act="inc" data-id="${h.id}" aria-label="Increase">+</button></div>`;
  }
  if(r.tracking==='checklist'){const n=Array.isArray(v)?v.length:0;return `<button class="rb${dn?' on':''}${locked?' lk':''}" data-act="${locked?'locked':'list'}" data-id="${h.id}" aria-label="Checklist">${dn?IC.check:n+'/'+r.items.length}</button>`}
  return `<button class="rb${dn?' on':''}${locked?' lk':''}" data-act="${locked?'locked':'toggle'}" data-id="${h.id}" aria-label="${locked?'Locked':'Mark done'}">${IC.check}</button>`;
}
const dimOf=c=>{const n=parseInt(c.slice(1),16);return `rgb(${Math.round((n>>16&255)*.14)},${Math.round((n>>8&255)*.14)},${Math.round((n&255)*.14)})`};
function card(h,d,locked){
  const c=calc(h),t=today(),has=!!S.notes[h.id+'|'+d],fut=d>t;let sub,sc='';
  if(d===t)sub=h.showStreak?`Streak: ${c.streak} day${c.streak===1?'':'s'}`:esc(h.desc||h.category||'');
  else{const dn=isDone(h,d),due=dueOn(h,d);sub=fut?(due?'Coming up':'Not due'):dn?'Done':due?'Missed':'Not due';sc=d<t?(dn?' ok':due?' miss':''):''}
  if(isMed(h)){const s=medDay(d);if(s)sub+=`${sub?' · ':''}${fmtShort(s)} meditated`}
  return `<div class="hc${dueOn(h,d)||isDone(h,d)?'':' dim'}" style="--c:${h.color};--cd:${dimOf(h.color)}" data-act="open" data-id="${h.id}" data-k="${h.id}" data-flip="1">
<div class="hr"><div class="ico">${esc(h.icon)}</div><div class="mt"><div class="ttl">${esc(h.title)}</div><div class="sub${sc}">${sub}</div></div>
<button class="rb note${has?' has':''}${fut?' lk':''}" data-act="${fut?'locked':'note'}" data-id="${h.id}" aria-label="Note">${IC.note}</button>${ctrl(h,d,locked)}</div>${heat(h)}</div>`;
}

function vTimeline(){
  const ev=[],t=today(),hs=active();
  hs.forEach(h=>{ev.push({d:h.created,o:0,k:'start',t:`Started “${h.title}”`});if(h.showStreak)calc(h).miles.forEach(m=>ev.push({d:m.date,o:1,k:'mile',t:`${h.title}: ${m.n}-day streak`}))});
  if(hs.length){
    const first=hs.map(h=>h.created).sort()[0];
    for(let d=first;d<=t;d=addDays(d,1)){const s=dayStats(d,hs);if(s.done>0)ev.push({d,o:2,k:'day',t:s.done>=s.total?`Perfect day: all ${s.total} habits done`:`${s.done} of ${s.total} habits done`})}
  }

  ev.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.o-a.o);

try{CAN_SHARE_FILES=!!(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]}))}catch(e){}

  const st=S.settings,arch=S.habits.filter(h=>h.archived).length,due=backupDue();

  return `<div class="top"><h1 class="tt">Data</h1></div>

<h3 class="sect">Backup</h3>
<button class="row${due?' warm':''}" data-act="export"><span>Export Data<small>${due?(ago==null?'You have no backup yet. Save one now.':`Your last backup was ${ago} days ago.`):'Download a backup file to your phone'}</small></span>${IC.down}</button>
${CAN_SHARE_FILES?`<button class="row" data-act="sharebk"><span>Send backup<small>Save it to Google Drive, email or a chat</small></span>${IC.share}</button>`:''}
<button class="row" data-act="import"><span>Import Data<small>Restore habits, history and meditation time</small></span>${IC.up}</button>

<button class="row" data-act="order"><span>Rearrange habits<small>Change the order on the Habits tab</small></span>${IC.sort}</button>
<button class="row" data-act="archlist"><span>Archived habits<small>${arch?`${arch} archived. Restore or delete them.`:'Habits you archive appear here'}</small></span>${IC.archive}</button>
<h3 class="sect">App</h3>
<button class="row${ui.update?' hl':''}" data-act="${ui.update?'reload':'checkupd'}"><span>${ui.update?'Update now':'Check for updates'}<small>${ui.update?`Version ${esc(ui.newVer||'')} is ready`:'Looks for a newer version of the app'}</small></span>${IC.refresh}</button>
${(()=>{const u=readUndo();return u?`<button class="row hl" data-act="undo"><span>Undo last ${u.what}<small>Brings back your data from before it</small></span>${IC.reset}</button>`:''})()}
<section class="blk"><h3>Week starts on</h3><div class="seg">${seg('week',[['1','Monday'],['0','Sunday']],String(st.weekStart))}</div></section>
<button class="row dg" data-act="reset"><span>Reset everything<small>Deletes all habits, history and meditation time</small></span>${IC.trash}</button>`;

function navHtml(){
  const it=(v,ic,l,x='')=>`<button class="ni${ui.view===v?' on':''}${x}" data-act="tab" data-v="${v}" aria-label="${l}">${ic}<span>${l}</span></button>`;
  return `<nav class="nav" data-k="nav">${it('home',IC.grid,'Habits')}${it('med',IC.lotus,'Meditate')}<button class="add" data-act="add" aria-label="Add habit">${IC.plus}</button>${it('timeline',IC.lines,'Timeline')}${it('data',IC.db,'Data',backupDue()?' dot':'')}</nav>`;
}
function sheetHtml(){
  const s=ui.sheet;let b='';
  if(s.t==='color')b=`<h3>Color</h3><div class="cgrid">${COLORS.map(c=>`<button class="cs${c===ui.form.color?' on':''}" style="background:${c}" data-act="pc" data-v="${c}" aria-label="Color ${c}"></button>`).join('')}</div>`;
  else if(s.t==='icon')b=`<h3>Icon</h3><div class="ig">${EMOJI.map(e=>`<button class="${e===ui.form.icon?'on':''}" data-act="pi" data-v="${e}">${e}</button>`).join('')}</div>`;
  else if(s.t==='cl'){
    const h=byId(s.id),r=rule(h,s.date),v=Array.isArray(logOf(h,s.date))?logOf(h,s.date):[];
    b=`<h3>${esc(h.title)}</h3>${r.items.map((it,i)=>`<button class="cli${v.includes(i)?' on':''}" data-act="cl" data-i="${i}"><span class="bx">${v.includes(i)?IC.check:''}</span>${esc(it)}</button>`).join('')}<button class="btn g" data-act="closesheet">Done</button>`;
  }
  else if(s.t==='note'){const h=byId(s.id);b=`<h3>Note for ${esc(h.title)}, ${dayLabel(s.date)}</h3><textarea class="inp" id="nt" style="margin-top:0" placeholder="Write a note for ${longDate(s.date)}">${esc(S.notes[s.id+'|'+s.date]||'')}</textarea><button class="btn" data-act="savenote">Save note</button>`}
  else if(s.t==='info')b=`<h3>What is Habit Score?</h3><p>Habit Score measures how strong a habit is. It weighs <b>recent days more</b>, so it grows fast at first, drops when you miss days, and recovers when you get back on track.</p><p><b>Success rate</b> is simpler: the share of due days you completed. Do a habit on 5 of 10 days and your success rate is 50%.</p><p>A <b>perfect day</b> is a day where every habit that was due got done.</p><button class="btn g" data-act="closesheet">Got it</button>`;
  else if(s.t==='confirm')b=`<h3>${esc(s.title)}</h3><p>${esc(s.msg)}</p><button class="btn d" data-act="${s.yes}">${esc(s.label)}</button><button class="btn g" data-act="closesheet">Cancel</button>`;
  else if(s.t==='spset'){const u=S.spotify.url;b=`<h3>Your meditation playlist</h3><p>In Spotify, open the playlist, tap <b>Share</b>, then <b>Copy link</b>, and paste it here.</p><input class="inp" id="spu" type="url" inputmode="url" autocomplete="off" placeholder="https://open.spotify.com/playlist/…" value="${esc(u)}"><button class="btn" data-act="spsave">Save playlist</button>${u?'<button class="btn g" data-act="spclear">Remove playlist</button>':''}`}
  else if(s.t==='order'){const hs=active();b=`<h3>Rearrange habits</h3>${hs.map((h,i)=>`<div class="rr" style="--c:${h.color}" data-k="o${h.id}" data-flip="1"><div class="ico">${esc(h.icon)}</div><div class="ttl">${esc(h.title)}</div><button class="xb" data-act="mv" data-id="${h.id}" data-s="-1" aria-label="Move up"${i?'':' style="visibility:hidden"'}>${IC.cup}</button><button class="xb" data-act="mv" data-id="${h.id}" data-s="1" aria-label="Move down"${i<hs.length-1?'':' style="visibility:hidden"'}>${IC.cdown}</button></div>`).join('')}<button class="btn g" data-act="closesheet">Done</button>`}
  else if(s.t==='arch'){const hs=S.habits.filter(h=>h.archived);b=`<h3>Archived habits</h3>${hs.length?hs.map(h=>`<div class="rr" style="--c:${h.color}" data-k="a${h.id}" data-flip="1"><div class="ico">${esc(h.icon)}</div><div class="ttl">${esc(h.title)}</div><button class="mini" data-act="restore" data-id="${h.id}">Restore</button><button class="mini d" data-act="adel" data-id="${h.id}">Delete</button></div>`).join(''):'<p>No archived habits. Archive one from its page to hide it without losing its history.</p>'}<button class="btn g" data-act="closesheet">Done</button>`}
  return `<div class="ov" data-act="closesheet" data-k="sheet-${s.t}"><div class="sh" data-act="noop" role="dialog" aria-modal="true">${b}</div></div>`;
}
function modalHtml(){
  return `<div class="modal" data-act="noop" data-k="modal"><div class="mbox" role="alertdialog" aria-modal="true"><div class="mi">${IC.refresh}</div><h3>Update available</h3><p>A newer version of Habit Log is ready${ui.newVer?` (v${esc(ui.newVer)})`:''}. Your habits and history stay on this phone.</p><button class="btn" data-act="reload">Update now</button><button class="btn g" data-act="later">Later</button></div></div>`;
}

const root=document.getElementById('app');
function render(){
  memo.clear();
  if(ui.view==='form'&&!ui.form)ui.view='home';
  const V={home:vHome,timeline:vTimeline,score:vScore,detail:vDetail,form:vForm,med:vMed,data:vData}[ui.view]||vHome;
  const body=V();
  const key=ui.view+(ui.view==='detail'||ui.view==='form'?':'+(ui.id||'new'):'');
  const viewChanged=ui.lk!==key,showModal=ui.update&&!ui.later;
  const html=`<div class="ban${ui.update&&ui.later?'':' hide'}" data-k="ban">Update ready<button data-act="reload">Update now</button></div>`
    +`<main class="view" data-k="${esc(key)}">${body}</main>`
    +(ROOTS.includes(ui.view)?navHtml():'')
    +(ui.sheet?sheetHtml():'')
    +(showModal?modalHtml():'');
  root.querySelectorAll(':scope > .ov, :scope > .modal').forEach(el=>{
    const keep=el.classList.contains('ov')?!!(ui.sheet&&el.getAttribute('data-k')==='sheet-'+ui.sheet.t):showModal;
    if(!keep){el.removeAttribute('data-act');el.querySelectorAll('[data-act]').forEach(x=>x.removeAttribute('data-act'));document.body.appendChild(el);el.classList.add('out');setTimeout(()=>el.remove(),240)}
  });
  const dk=ui.view==='home'?ui.date:null,dateChanged=!viewChanged&&!!dk&&!!ui.ld&&ui.ld!==dk;
  const olds=dateChanged&&!REDUCED?[...root.querySelectorAll('.swp')].map(el=>({el,host:el.parentNode})):[];
  const before=viewChanged||REDUCED||dateChanged?null:flipBefore();
  const tpl=document.createElement('template');tpl.innerHTML=html;
  if(before)ghostOut(tpl.content);
  morphKids(root,tpl.content);
  if(viewChanged){window.scrollTo(0,0);ui.lk=key}
  if(before)flipAfter(before);
  if(olds.length)swapIn(olds,ui.dir||1);
  ui.ld=dk;
  document.querySelectorAll('.needle').forEach(n=>{
    if(n._m)return;n._m=1;
    n.style.transition='none';n.style.transform='rotate(-90deg)';n.getBoundingClientRect();
    n.style.transition='';n.style.transform=`rotate(${n.dataset.rot}deg)`;
  });
  if(ui.view==='med'){lastSec=-1;if(S.med.start&&!raf)raf=requestAnimationFrame(medTick)}
}

/* ---------- actions ---------- */
function shareText(){
  const ov=overall(),s=dayStats(today());
  return `Habit Log: Habit Score ${ov.score.toFixed(0)}/100, success rate ${ov.rate.toFixed(0)}%. Today ${s.done} of ${s.total} habits done. Total meditation ${fmtShort(medAll())}.`;
}
function saveForm(){
  const f=ui.form,title=f.title.trim(),h=ui.id?byId(ui.id):null;
  if(!title)return toast('Enter a habit title');
  if(f.freq.mode==='weekdays'&&!f.freq.days.length)return toast('Pick at least one weekday');
  if(f.freq.mode==='monthdays'&&!f.freq.mdays.length)return toast('Pick at least one day of the month');
  const items=f.itemsText.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,30);
  if(f.tracking==='checklist'&&!items.length&&!isMed(h))return toast('Add at least one checklist item');
  const t=today();
  const nr=cleanRule({from:t,freq:f.freq,tracking:f.tracking,target:f.target,items},t);
  const meta={title,desc:f.desc.trim().slice(0,120),color:reColor.test(f.color)?f.color:COLORS[0],icon:f.icon,type:f.type,category:f.category.trim().slice(0,24),showStreak:f.showStreak};
  if(h){
    Object.assign(h,meta);
    const c=cur(h);
    if(ruleSig(c)!==ruleSig(nr)){
      if(c.tracking!==nr.tracking&&S.logs[h.id])delete S.logs[h.id][t];
      if(c.from>=t){nr.from=c.from;h.rules[h.rules.length-1]=nr}else h.rules.push(nr);
      toast('Saved. The new schedule starts today.');
    }else toast('Habit saved');
  }else{S.habits.push({id:uid(),...meta,created:t,archived:false,rules:[nr]});S.logs[S.habits[S.habits.length-1].id]={};toast('Habit added')}
  save();ui.leaving=true;history.back();
}
const backupName=()=>`habit-log-backup-${today()}.json`;
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=backupName();document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  S.settings.lastBackup=today();save();toast('Backup saved to your Downloads');render();
}
async function shareBackup(){
  try{
    const file=new File([JSON.stringify(S,null,2)],backupName(),{type:'application/json'});
    await navigator.share({files:[file],title:'Habit Log backup'});
    S.settings.lastBackup=today();save();render();
  }catch(e){}
}
function cmpV(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
async function checkUpdate(manual){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('bad');
    const j=await r.json();
    if(j.version&&cmpV(j.version,APP_VERSION)>0){const isNew=!ui.update||ui.newVer!==j.version;ui.update=true;ui.newVer=String(j.version).slice(0,20);if(isNew||manual)ui.later=false;render()}
    else if(manual)toast('You have the latest version');
  }catch(e){if(manual)toast('Could not check for updates. Check your connection.')}
}
function reload(){
  const go=()=>location.reload();
  try{if(window.caches)caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(go,go);else go()}catch(e){go()}
}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function popEl(sel){const b=document.querySelector(sel);if(!b)return;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),450)}
function keepUndo(what){try{localStorage.setItem(KEY+'.undo',JSON.stringify({at:Date.now(),what,data:S}))}catch(e){}}
function readUndo(){try{const u=JSON.parse(localStorage.getItem(KEY+'.undo')||'null');return u&&u.data&&Array.isArray(u.data.habits)?u:null}catch(e){return null}}
function confirmSheet(title,msg,yes,label){ui.sheet={t:'confirm',title,msg,yes,label};render()}
function deleteHabit(id){S.habits=S.habits.filter(x=>x.id!==id);delete S.logs[id];Object.keys(S.notes).forEach(k=>{if(k.startsWith(id+'|'))delete S.notes[k]});if(S.settings.medHabit===id)S.settings.medHabit=null;save()}
function medSave(force){
  if(!clockOk()){toast(CLOCK_MSG);return}
  const secs=Math.round(medElapsed()/1000);if(secs<1){toast('Start the timer first');return}
  if(!force&&secs>LONG_SESSION){confirmSheet('Save a long session?',`The timer ran for ${fmtDur(secs)}. If you forgot to stop it, cancel and tap Reset instead.`,'medSaveYes','Save anyway');return}
  const d=today(),h=medHabit(),was=h?isDone(h,d):false;
  (S.medLog[d]=S.medLog[d]||[]).push({at:Date.now(),s:secs});medClear();
  const now=h?isDone(h,d):false;
  ui.sheet=null;buzz();toast(`Saved ${fmtDur(secs)}.${!was&&now?' Meditate is done for today.':''}`);render();
}
function afterDayChange(){if(medStale())toast("Yesterday's unsaved timer was cleared");}

function act(a,d){
  const h=d.id?byId(d.id):null,date=ui.date;
  switch(a){
    case 'noop':return;
    case 'tab':tab(d.v);return;
    case 'locked':toast(!clockOk()?CLOCK_MSG:(ui.date>today()?"You can't log future days.":'Past days are read-only. You can only change today.'));return;
    case 'gotoday':setDate(today());return;
    case 'day':setDate(d.d);return;
    case 'pickdate':pickDate();return;
    case 'filter':ui.filter=d.f;render();return;
    case 'cat':ui.cat=d.c||null;render();return;
    case 'score':nav('score');return;
    case 'back':if(formDirty()){confirmSheet('Discard changes?','Your changes to this habit haven’t been saved.','discard','Discard changes');return}history.back();return;
    case 'share':{const txt=shareText();if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Progress copied'),()=>toast(txt));else toast(txt);return}
    case 'open':ui.cal=null;nav('detail',d.id);return;
    case 'toggle':{if(!h||isMed(h)||!canLog(date))return;const was=isDone(h,date);setLog(h,date,was?null:1);buzz();render();if(!was)popEl(`[data-act="toggle"][data-id="${h.id}"]`);return}
    case 'inc':if(!h||!canLog(date))return;setLog(h,date,Math.min(99999,(logOf(h,date)||0)+1));buzz();render();if(isDone(h,date))popEl(`[data-k="${h.id}"] .cnt`);return;
    case 'dec':if(!h||!canLog(date))return;setLog(h,date,Math.max(0,(logOf(h,date)||0)-1));render();return;
    case 'list':if(!h||!canLog(date))return;ui.sheet={t:'cl',id:d.id,date};render();return;
    case 'cl':{const s=ui.sheet,hh=s&&byId(s.id);if(!hh||!canLog(s.date))return;const c0=Array.isArray(logOf(hh,s.date))?logOf(hh,s.date).slice():[],i=+d.i,k=c0.indexOf(i);
      if(k>=0)c0.splice(k,1);else c0.push(i);setLog(hh,s.date,c0);buzz();render();return}
    case 'note':if(date>today())return;ui.sheet={t:'note',id:d.id,date};render();setTimeout(()=>{const n=document.getElementById('nt');if(n)n.focus()},350);return;
    case 'savenote':{const s=ui.sheet;if(!s||s.date>today())return;const v=document.getElementById('nt').value.trim().slice(0,1000),k=s.id+'|'+s.date;if(v)S.notes[k]=v;else delete S.notes[k];save();ui.sheet=null;toast(v?'Note saved':'Note removed');render();return}
    case 'closesheet':ui.sheet=null;render();return;
    case 'info':ui.sheet={t:'info'};render();return;
    case 'calprev':{let {y,m}=ui.cal;m--;if(m<0){m=11;y--}ui.cal={y,m};render();return}
    case 'calnext':{let {y,m}=ui.cal;m++;if(m>11){m=0;y++}ui.cal={y,m};render();return}
    case 'add':ui.form=blankForm();ui.form0=JSON.stringify(ui.form);nav('form');return;
    case 'edit':{const hh=byId(ui.id);if(!hh)return;ui.form=formFrom(hh);ui.form0=JSON.stringify(ui.form);nav('form',ui.id);return}
    case 'discard':ui.sheet=null;if(ui.view!=='form'){render();return}ui.leaving=true;history.back();return;
    case 'arch':{const hh=byId(ui.id);if(!hh)return;hh.archived=true;save();toast('Archived. Restore it from the Data tab.');history.back();return}
    case 'restore':if(h){h.archived=false;save();toast(`${h.title} is back on your list`);render()}return;
    case 'del':confirmSheet('Delete this habit?','All of its history and notes will be removed. This cannot be undone. Archive it instead to keep the history.','delyes','Delete habit');return;
    case 'delyes':deleteHabit(ui.id);ui.sheet=null;toast('Habit deleted');history.back();return;
    case 'adel':ui.pending=d.id;confirmSheet('Delete this habit?','All of its history and notes will be removed. This cannot be undone.','adelyes','Delete habit');return;
    case 'adelyes':if(ui.pending)deleteHabit(ui.pending);ui.pending=null;ui.sheet={t:'arch'};toast('Habit deleted');render();return;
    case 'order':ui.sheet={t:'order'};render();return;
    case 'archlist':ui.sheet={t:'arch'};render();return;
    case 'mv':{const list=active(),i=list.findIndex(x=>x.id===d.id),j=i+(+d.s);if(i<0||j<0||j>=list.length)return;
      const a1=S.habits.indexOf(list[i]),b1=S.habits.indexOf(list[j]);[S.habits[a1],S.habits[b1]]=[S.habits[b1],S.habits[a1]];save();render();return}
    /* form */
    case 'ftype':ui.form.type=d.v;render();return;
    case 'ffreq':ui.form.freq.mode=d.v;render();return;
    case 'fwd':{const arr=ui.form.freq.days,n=+d.v,k=arr.indexOf(n);if(k>=0)arr.splice(k,1);else arr.push(n);render();return}
    case 'fmd':{const arr=ui.form.freq.mdays,n=+d.v,k=arr.indexOf(n);if(k>=0)arr.splice(k,1);else arr.push(n);render();return}
    case 'fper':ui.form.freq.period=d.v;ui.form.freq.count=Math.min(ui.form.freq.count,d.v==='week'?7:31);render();return;
    case 'fstep':{const f=ui.form,s=+d.s;if(d.k==='count'){const mx=f.freq.period==='week'?7:31;f.freq.count=Math.max(1,Math.min(mx,f.freq.count+s))}else f.target=Math.max(1,Math.min(999,f.target+s));render();return}
    case 'ftrack':ui.form.tracking=d.v;render();return;
    case 'fcat':ui.form.category=ui.form.category===d.v?'':d.v;render();return;
    case 'fstreak':ui.form.showStreak=!ui.form.showStreak;render();return;
    case 'pcolor':ui.sheet={t:'color'};render();return;
    case 'picon':ui.sheet={t:'icon'};render();return;
    case 'pc':ui.form.color=d.v;ui.sheet=null;render();return;
    case 'pi':ui.form.icon=d.v;ui.sheet=null;render();return;
    case 'save':saveForm();return;
    /* meditation */
    case 'goal':{const g=+d.v,t=today(),G=S.med.goals,last=G[G.length-1];if(!GOALS.includes(g)||goalAt(t)===g)return;
      if(last.from===t)last.goal=g;else G.push({from:t,goal:g});S.med.notified=medTotal(medElapsed())>=g;save();render();return}
    case 'medToggle':{if(!clockOk()){toast(CLOCK_MSG);return}const m=S.med;
      if(m.start){m.acc+=Date.now()-m.start;m.start=null;wakeOff()}
      else{medStale();audioUnlock();const fresh=!m.acc;if(fresh){m.began=Date.now();m.notified=medDay(today())>=goalAt(today())}m.start=Date.now();wakeOn();
      }
      save();buzz();render();return}
    case 'medReset':{const el=medElapsed();if(el>=60000){confirmSheet('Reset the timer?',`You'll lose ${fmtDur(el/1000)} that hasn't been saved.`,'medResetYes','Reset timer');return}medClear();render();return}
    case 'medResetYes':medClear();ui.sheet=null;render();return;
    case 'spset':ui.sheet={t:'spset'};render();setTimeout(()=>{const n=document.getElementById('spu');if(n)n.focus()},350);return;
    case 'spsave':{const v=cleanSpotify(document.getElementById('spu').value);if(!v){toast('That doesn’t look like a Spotify link');return}S.spotify.url=v;save();ui.sheet=null;toast('Playlist saved');render();return}
    case 'spclear':S.spotify.url='';save();ui.sheet=null;toast('Playlist removed');render();return;
    case 'medSave':medSave(false);return;
    case 'medSaveYes':medSave(true);return;
    case 'medDel':if(d.d!==today()){toast('Past sessions are read-only.');return}ui.pending={d:d.d,i:+d.i};confirmSheet('Delete this session?','It will be removed from your meditation totals.','medDelYes','Delete session');return;
    case 'medDelYes':{const p=ui.pending;if(p&&p.d===today()&&S.medLog[p.d]){S.medLog[p.d].splice(p.i,1);if(!S.medLog[p.d].length)delete S.medLog[p.d];save()}ui.pending=null;ui.sheet=null;toast('Session deleted');render();return}
    /* data */
    case 'week':S.settings.weekStart=+d.v===0?0:1;save();render();return;
    case 'export':exportData();return;
    case 'sharebk':shareBackup();return;
    case 'import':document.getElementById('file').click();return;
    case 'importyes':{if(ui.pending&&typeof ui.pending==='object'){keepUndo('import');wakeOff();const keep=S.settings.maxSeen;S=sanitize(ui.pending);S.settings.maxSeen=Math.max(keep||0,Math.min(S.settings.maxSeen||0,Date.now()));ui.pending=null;save();ui.sheet=null;ui.date=today();toast('Backup imported');tab('home')}return}
    case 'checkupd':checkUpdate(true);return;
    case 'undo':{const u=readUndo();if(!u)return;confirmSheet(u.what==='import'?'Undo the import?':'Undo the reset?',`This brings back your data from ${dayLabel(ds(new Date(u.at))).toLowerCase()} at ${clock(u.at)}, before the ${u.what}.`,'undoyes','Bring it back');return}
    case 'undoyes':{const u=readUndo();if(!u)return;const keep=S.settings.maxSeen;S=sanitize(u.data);S.settings.maxSeen=keep;save();try{localStorage.removeItem(KEY+'.undo')}catch(e){}ui.sheet=null;ui.date=today();toast('Your data is back');tab('home');return}
    case 'reset':confirmSheet('Reset everything?','This deletes all habits, history, notes and meditation time on this phone. Export a backup first if you want to keep them.','resetyes','Delete everything');return;
    case 'resetyes':{keepUndo('reset');wakeOff();const keep=S.settings.maxSeen;S=sanitize(seedRaw());S.settings.maxSeen=keep;save();ui.sheet=null;ui.date=today();toast('Everything was reset');tab('home');return}
    case 'reload':reload();return;
    case 'later':ui.later=true;render();return;
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el.dataset)});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&ui.form&&f in ui.form)ui.form[f]=e.target.value});
document.getElementById('dp').addEventListener('change',e=>{const v=e.target.value;if(!reDate.test(v))return;const lo=startOfWeek(firstDay()),hi=addDays(startOfWeek(today()),6);setDate(v<lo?lo:v>hi?hi:v)});
document.getElementById('file').addEventListener('change',e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  if(file.size>5e6){toast('That file is too large to be a Habit Log backup');return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);if(!o||!Array.isArray(o.habits))throw new Error('bad');
      ui.pending=o;confirmSheet('Replace your data?',`This backup has ${o.habits.length} habits. It will replace everything currently on this phone.`,'importyes','Import backup');
    }catch(err){toast("That file isn't a Habit Log backup")}
  };
  r.readAsText(file);
});
function dayCheck(){if(ui.stamp!==today()){const old=ui.stamp;ui.stamp=today();if(ui.date===old)ui.date=today();afterDayChange();return true}return false}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  dayCheck();if(S.med.start)wakeOn();
  checkUpdate(false);render();
});
setInterval(()=>{if(dayCheck())render()},30000);

if(medStale())setTimeout(()=>toast("Yesterday's unsaved timer was cleared"),600);
render();
checkUpdate(false);
setInterval(()=>checkUpdate(false),20*60*1000);
try{if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{if(p){ui.persisted=true;render();return}return navigator.storage.persist().then(x=>{ui.persisted=!!x;render()})}).catch(()=>{})}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(/[?&]test\b/.test(location.search))window.__habit={get S(){return S},calc,overall,dayStats,perfect,ui,act,render,medElapsed,clockOk};
})();
</script>
</body>
